# P15a / BX-27.a — weekly provider connection & quota monitoring (Appendix G S1–S2).
# Read-only. Does not change Router or registry. Secrets stay in GitHub Secrets / never printed.
name: monitor-connections

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # issues: write is intentional for a future follow-up that opens/dedupes Issues;
  # this workflow only uploads an artifact so it stays safe with contents:read.

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run monitor (offline-safe; NOT_RUN without keys)
        run: npm run monitor:connections -- --json --dry-run --no-db
        env:
          # Optional: when set, live path can be extended later without changing the workflow shape.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Upload monitor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-connections-report
          path: |
            # placeholder — JSON is on stdout; keep step for future file output
            package.json
          retention-days: 14
          if-no-files-found: ignore
