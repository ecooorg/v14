<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Block Gradients -->
    <!-- Cyan (I) -->
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <!-- Purple (T) -->
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <!-- Yellow (O) -->
    <linearGradient id="yellowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <!-- Green (S) -->
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <!-- Red (Z) -->
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <!-- Orange (L) -->
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <filter id="blockGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6" />

  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="2" opacity="0.3">
    <line x1="96" y1="96" x2="96" y2="416" />
    <line x1="160" y1="96" x2="160" y2="416" />
    <line x1="224" y1="96" x2="224" y2="416" />
    <line x1="288" y1="96" x2="288" y2="416" />
    <line x1="352" y1="96" x2="352" y2="416" />
    <line x1="416" y1="96" x2="416" y2="416" />
    
    <line x1="96" y1="96" x2="416" y2="96" />
    <line x1="96" y1="160" x2="416" y2="160" />
    <line x1="96" y1="224" x2="416" y2="224" />
    <line x1="96" y1="288" x2="416" y2="288" />
    <line x1="96" y1="352" x2="416" y2="352" />
    <line x1="96" y1="416" x2="416" y2="416" />
  </g>

  <!-- Tetris Blocks Illustration (Safe zone center 80%) -->
  <!-- T-piece at center-top -->
  <g filter="url(#blockGlow)">
    <!-- T top horizontal bar -->
    <rect x="164" y="164" width="56" height="56" rx="8" fill="url(#purpleGrad)" stroke="#f3e8ff" stroke-width="2" />
    <rect x="228" y="164" width="56" height="56" rx="8" fill="url(#purpleGrad)" stroke="#f3e8ff" stroke-width="2" />
    <rect x="292" y="164" width="56" height="56" rx="8" fill="url(#purpleGrad)" stroke="#f3e8ff" stroke-width="2" />
    <!-- T center bottom -->
    <rect x="228" y="228" width="56" height="56" rx="8" fill="url(#purpleGrad)" stroke="#f3e8ff" stroke-width="2" />

    <!-- O-Piece (Yellow) bottom right -->
    <rect x="292" y="292" width="56" height="56" rx="8" fill="url(#yellowGrad)" stroke="#fef08a" stroke-width="2" />
    <rect x="356" y="292" width="56" height="56" rx="8" fill="url(#yellowGrad)" stroke="#fef08a" stroke-width="2" />
    <rect x="292" y="356" width="56" height="56" rx="8" fill="url(#yellowGrad)" stroke="#fef08a" stroke-width="2" />
    <rect x="356" y="356" width="56" height="56" rx="8" fill="url(#yellowGrad)" stroke="#fef08a" stroke-width="2" />

    <!-- I-Piece (Cyan) left vertical bar -->
    <rect x="100" y="164" width="56" height="56" rx="8" fill="url(#cyanGrad)" stroke="#e0f2fe" stroke-width="2" />
    <rect x="100" y="228" width="56" height="56" rx="8" fill="url(#cyanGrad)" stroke="#e0f2fe" stroke-width="2" />
    <rect x="100" y="292" width="56" height="56" rx="8" fill="url(#cyanGrad)" stroke="#e0f2fe" stroke-width="2" />
    <rect x="100" y="356" width="56" height="56" rx="8" fill="url(#cyanGrad)" stroke="#e0f2fe" stroke-width="2" />

    <!-- S-Piece (Green) center bottom -->
    <rect x="228" y="356" width="56" height="56" rx="8" fill="url(#greenGrad)" stroke="#dcfce7" stroke-width="2" />
    <rect x="164" y="356" width="56" height="56" rx="8" fill="url(#greenGrad)" stroke="#dcfce7" stroke-width="2" />
    <rect x="164" y="292" width="56" height="56" rx="8" fill="url(#orangeGrad)" stroke="#ffedd5" stroke-width="2" />
    <rect x="228" y="292" width="56" height="56" rx="8" fill="url(#orangeGrad)" stroke="#ffedd5" stroke-width="2" />
  </g>

  <!-- Subtle glow line at top -->
  <line x1="120" y1="110" x2="392" y2="110" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6" />
</svg>
