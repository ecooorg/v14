# Canonical inventory of external connections (TZ Appendix E.6). Never put secret values here.
# The body is JSON, which is valid YAML; full-line comments start with '#'. scripts/verify-connections.mjs reads this file.
{
  "version": 1,
  "connectors": {
    "gemini": {
      "required_from": "BX-10.b",
      "service": "Google Gemini API",
      "env": { "required": ["GEMINI_API_KEY"], "optional": ["GEMINI_API_KEY_FREE", "GEMINI_BASE_URL", "ENABLE_WEB_SEARCH", "WEB_SEARCH_MODE", "WEB_SEARCH_MODEL", "WEB_SEARCH_TIMEOUT_MS"] },
      "checks": [
        { "id": "list_models", "method": "GET", "url": "https://generativelanguage.googleapis.com/v1beta/models?pageSize=100", "auth": { "header": "x-goog-api-key", "env": "GEMINI_API_KEY" }, "expect": { "status": 200, "json_has": ["models"] } },
        { "id": "tiny_call", "method": "POST", "url": "https://generativelanguage.googleapis.com/v1beta/models/{MODEL_ID}:generateContent", "auth": { "header": "x-goog-api-key", "env": "GEMINI_API_KEY" }, "expect": { "status": 200, "json_has": ["candidates", "usageMetadata"] } }
      ]
    },
    "groq": {
      "required_from": "BX-12.a",
      "service": "Groq (OpenAI-compatible API)",
      "env": { "required": ["GROQ_API_KEY", "GROQ_PLAN"] },
      "checks": [
        { "id": "list_models", "method": "GET", "url": "https://api.groq.com/openai/v1/models", "auth": { "header": "Authorization", "scheme": "Bearer", "env": "GROQ_API_KEY" }, "expect": { "status": 200, "json_has": ["data"] } },
        { "id": "tiny_json_call", "method": "POST", "url": "https://api.groq.com/openai/v1/chat/completions", "auth": { "header": "Authorization", "scheme": "Bearer", "env": "GROQ_API_KEY" }, "expect": { "status": 200, "json_has": ["choices", "usage"], "content_is_json": true } }
      ]
    },
    "github": {
      "required_from": "BX-19",
      "service": "GitHub App API",
      "env": { "required": ["GITHUB_APP_ID", "GITHUB_APP_INSTALLATION_ID", "GITHUB_APP_PRIVATE_KEY", "GITHUB_WEBHOOK_SECRET"], "optional": ["GITHUB_REPOSITORY_OWNER", "GITHUB_REPOSITORY_NAME", "GITHUB_API_BASE_URL", "GITHUB_DIFF_UPLOAD"] },
      "max_permissions": { "metadata": "read", "contents": "read", "checks": "read", "pull_requests": "read" },
      "max_permissions_model_patch": { "contents": "write", "pull_requests": "write" },
      "checks": [ { "id": "installation_token_and_repo", "kind": "github_app_flow", "expect": { "status": "2xx", "permissions_within_max": true } } ]
    },
    "postgres": {
      "required_from": "BX-04",
      "service": "PostgreSQL on Railway",
      "env": { "required": ["DATABASE_URL"] },
      "checks": [
        { "id": "select_1", "kind": "sql", "query": "SELECT 1", "expect": { "rows": 1 } }
      ]
    }
  }
}
